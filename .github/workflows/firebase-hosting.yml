name: Deploy Hubsom Flutter web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hubsom_app/**"
      - ".github/workflows/firebase-hosting.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hubsom_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: >
          flutter build web --release --base-href /
          --dart-define=HUBSOM_API_BASE_URL=https://hubsom.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing GitHub secret FIREBASE_TOKEN. Create one with: firebase login:ci"
            exit 1
          fi
          firebase deploy --only hosting --project hubsom-web --non-interactive --token "$FIREBASE_TOKEN"

<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hubsom — live commerce marketplace for Ghana. Shop, auctions, live shopping.">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="mobile-web-app-capable" content="no">
  <meta name="apple-mobile-web-app-capable" content="no">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hubsom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hubsom</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      var alreadyReloaded = false;
      try { alreadyReloaded = sessionStorage.getItem('hubsom_sw_reloaded') === '1'; } catch (_) {}
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (key) { return caches.delete(key); }));
        }).catch(function () {});
      }
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) { return reg.unregister(); })).then(function () {
          if (alreadyReloaded || !regs.length) return;
          try { sessionStorage.setItem('hubsom_sw_reloaded', '1'); } catch (_) {}
          location.reload();
        });
      }).catch(function () {});
      navigator.serviceWorker.register = function () {
        return Promise.reject(new Error('Hubsom disables service workers so Safari cannot pin an old build'));
      };
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; background: #0A3D5C; }
    #hubsom-boot {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      text-align: center;
      padding: 24px;
    }
    #hubsom-boot h1 { margin: 0 0 8px; font-size: 28px; }
    #hubsom-boot p { margin: 0; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="hubsom-boot">
    <h1 id="hubsom-boot-title">Hubsom</h1>
    <p id="hubsom-boot-copy">Loading…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('hubsom-boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hubsom — live commerce marketplace for Ghana. Shop, auctions, live shopping.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hubsom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hubsom</title>
  <link rel="manifest" href="manifest.json">
  <!-- cache-bust: 2026-09-06-afia-admin-v89 -->
  <style>
    html, body { height: 100%; margin: 0; background: #0A3D5C; }
    #hubsom-boot {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      text-align: center;
      padding: 24px;
    }
    #hubsom-boot h1 { margin: 0 0 8px; font-size: 28px; }
    #hubsom-boot p { margin: 0; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="hubsom-boot">
    <h1 id="hubsom-boot-title">Hubsom</h1>
    <p id="hubsom-boot-copy">Loading…</p>
  </div>
  <script>
    (function () {
      var path = (location.pathname || '').replace(/\/+$/, '');
      if (path.toLowerCase() === '/afia') {
        document.title = 'Hubsom Admin';
        var title = document.getElementById('hubsom-boot-title');
        var copy = document.getElementById('hubsom-boot-copy');
        if (title) title.textContent = 'Hubsom Admin';
        if (copy) copy.textContent = 'Opening the Afia portal…';
      }
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
      navigator.serviceWorker.register = function () {
        return Promise.reject(new Error('Hubsom disables service workers so account updates are not stuck on an old build'));
      };
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: hubsom_app
description: Hubsom marketplace — Android, iOS, and Web from one Flutter codebase.
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.2.1
  agora_rtc_engine: ^6.5.2
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  flutter_svg: ^2.1.0
  google_fonts: ^6.2.1
  responsive_framework: ^1.5.1
  infinite_scroll_pagination: ^5.0.0
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  image_picker: ^1.2.3
  web: ^1.1.1
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/images/

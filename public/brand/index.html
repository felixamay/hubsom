<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hubsom logo</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        padding: 4vw;
        background-color: #fff;
        background-image:
          linear-gradient(45deg, #e8eef3 25%, transparent 25%),
          linear-gradient(-45deg, #e8eef3 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e8eef3 75%),
          linear-gradient(-45deg, transparent 75%, #e8eef3 75%);
        background-size: 24px 24px;
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      }
      img {
        display: block;
        width: min(920px, 100%);
        height: auto;
        max-height: 86vh;
        object-fit: contain;
        object-position: center;
      }
    </style>
  </head>
  <body>
    <img src="./hubsom-logo.png" alt="Hubsom" width="1363" height="462" />
  </body>
</html>
